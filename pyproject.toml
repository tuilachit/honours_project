[project]
name = "financial-rag-evaluation"
version = "0.1.0"
description = "Schema-flexible exact-cell retrieval evaluation for financial RAG"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "numpy==2.3.3",
    "pyyaml==6.0.2",
    "sentence-transformers==5.7.0",
    "torch==2.13.0",
]

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "pytest==8.3.5",
    "ruff==0.11.2",
    "types-pyyaml==6.0.12.20241230",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
