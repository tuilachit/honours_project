condition:
  id: m2
  description: schema-flexible context-aware reranking trained with ordinary negatives
  evidence_unit: financial_fact
  produces_exact_cell_ranking: true

representation:
  unit: financial_fact

query_context:
  enabled: true
  mode: automatic

retrieval:
  routes:
    dense: true
    sparse: true
    structured: true
  candidate_union:
    enabled: true
    strategy: reciprocal_rank_fusion

reranker:
  enabled: true
  kind: schema_flexible_context_aware
  model_profile: context_aware_reranker

training:
  enabled: true
  project_training: true
  negative_strategy: ordinary

generation:
  deterministic_renderer_enabled: true
  llm_enabled: true

evaluation:
  chunk_metrics_enabled: false
  exact_cell_metrics_enabled: true
  downstream_answer_metrics_enabled: true
