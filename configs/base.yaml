project:
  name: schema-flexible-exact-cell-rag
  seed: 20260815
  results_dir: results
  data_dir: data
  cache_dir: data/cache
  require_clean_git_for_release: false

datasets:
  primary:
    name: G4KMU/t2-ragbench
    revision: adf7fe1541ac37351ce1142544d8e3b43010ed92
    manifest_path: configs/datasets/t2_ragbench.yaml
    raw_dir: data/t2_ragbench/raw
    derived_dir: data/t2_ragbench/derived
  external:
    name: PatronusAI/financebench
    revision: e04404e3a97f69f79c14d42f24981a1c9c3bcd18
    manifest_path: configs/datasets/financebench.yaml
    raw_dir: data/financebench/raw
    derived_dir: data/financebench/derived
    pdf_dir: data/financebench/pdfs
  verify_revision: true
  verify_file_hashes: true
  immutable_raw_data: true

audit:
  output_path: results/data_audit/t2_ragbench.json
  manifest_hash_algorithm: sha256
  common_required_fields:
    - id
    - context_id
    - split
    - question
    - program_answer
    - original_answer
    - context
    - file_name
    - company_name
    - report_year
  field_names:
    id: id
    context_id: context_id
    split: split
    question: question
    program_answer: program_answer
    original_answer: original_answer
    context: context
    file_name: file_name
    company_name: company_name
    page_number: page_number
  markdown_min_pipe_count: 2
  pilot_candidates_per_source: 20

pilot:
  enabled: false
  sample_size: 30
  candidates_per_source: 10
  annotation_path: annotations/pilot_annotations.yaml
  output_dir: results/pilot
  output_path: results/pilot/pilot_validation.json
  review_pack_output_path: results/pilot/human_source_review_pack.md
  expected_schema_version: 1
  required_annotation_status: first_pass_review_complete
  required_decision: include
  required_reasoning_type: direct_lookup
  required_review_status: user_approved
  minimum_valid_cells_per_question: 1
  minimum_near_misses_per_question: 2
  subset_targets:
    ConvFinQA: 10
    FinQA: 10
    TAT-DQA: 10
  coordinate_transforms:
    ConvFinQA:
      drop_leading_synthetic_column: false
    FinQA:
      drop_leading_synthetic_column: true
    TAT-DQA:
      drop_leading_synthetic_column: false
  table_hash_algorithm: sha256
  cell_id_hash_algorithm: sha256
  evaluation_use: project_development_only
  exclude_source_families_from_confirmatory_test: true
  require_per_question_annotation_seconds: false
  annotation_timing_required_for_scale_decision: true
  independent_review_target_fraction: 0.25
  independent_review_completed: false

screening:
  enabled: false
  batch_id: prospective_screening_batch_01
  audit_result_path: results/data_audit/t2_ragbench.json
  prior_annotation_path: annotations/pilot_annotations.yaml
  decision_log_path: annotations/prospective_screening_batch_01.yaml
  review_pack_output_path: results/pilot/prospective_screening_batch_01.md
  sample_size: 15
  subset_targets:
    ConvFinQA: 5
    FinQA: 5
    TAT-DQA: 5
  selection_method: seeded_sha256_rank_within_subset
  decisions:
    - include
    - exclude
    - unsure
  exclusion_reason_codes:
    - requires_calculation
    - answer_not_a_table_cell
    - ambiguous_cell_identity
    - insufficient_context
    - duplicate_or_leaked_item
    - other

synthetic_generation:
  enabled: false
  dataset_id: synthetic_exact_cell_500_v1
  sample_size: 500
  output_path: results/synthetic/synthetic_questions_500.json
  review_pack_output_path: results/synthetic/synthetic_questions_500_review.md
  decision_log_path: annotations/synthetic_questions_500_review.yaml
  subset_targets:
    ConvFinQA: 176
    FinQA: 0
    TAT-DQA: 324
  excluded_annotation_paths:
    - annotations/pilot_annotations.yaml
    - annotations/prospective_screening_batch_01.yaml
  selection_method: seeded_sha256_rank_after_quality_filters
  maximum_examples_per_company: 6
  minimum_table_rows: 3
  maximum_table_rows: 30
  minimum_table_columns: 3
  maximum_table_columns: 10
  minimum_concept_characters: 3
  maximum_concept_characters: 140
  minimum_concept_word_count: 2
  minimum_concept_overlap_token_characters: 4
  minimum_concept_token_overlap_ratio: 1.0
  allow_digits_in_concept: false
  allowed_single_token_concepts:
    - assets
    - backlog
    - cash
    - debt
    - expenses
    - income
    - liabilities
    - loss
    - profit
    - revenue
    - sales
  disallowed_exact_concepts:
    - domestic
    - foreign
    - international
    - other
    - real
    - total
    - u.s
  source_question_exclusion_phrases:
    - what was the percentage
    - what is the percentage
    - by what percentage
    - what was the change
    - what is the change
    - how much did
    - what was the difference
    - what is the difference
    - what was the ratio
    - what is the ratio
    - what is the mathematical range
    - how many years
    - did the
    - what was the maximum
    - what is the maximum
    - what was the minimum
    - what is the minimum
    - what was the highest
    - what is the highest
    - what was the lowest
    - what is the lowest
    - what was the largest
    - what is the largest
    - what was the greatest
    - what is the greatest
    - percent change
  source_modifier_evidence:
    average:
      - average
    percentage:
      - "%"
      - percentage
      - percent
    percent:
      - "%"
      - percentage
      - percent
    maximum:
      - maximum
    minimum:
      - minimum
    increase:
      - increase
    decrease:
      - decrease
  require_explicit_year_header: true
  require_source_answer_match: true
  require_source_question_year_match: true
  require_source_question_years_within_target_or_report_year: true
  require_source_question_concept_overlap: true
  require_unique_target_value_within_table: true
  require_wrong_period_negative: true
  require_wrong_concept_negative: true
  question_templates:
    - "{source_question}"
    - "Using the financial table, {source_question_lower}"
    - "According to the reported table, {source_question_lower}"
  human_decisions:
    - approve
    - edit
    - reject
    - unsure
  assistant_suggestion: approve
  table_hash_algorithm: sha256
  cell_id_hash_algorithm: sha256

fact_roundtrip:
  enabled: false
  input_path: results/synthetic/synthetic_questions_500.json
  review_log_path: annotations/synthetic_questions_500_review.yaml
  output_path: results/facts/synthetic_financial_fact_roundtrip.json
  required_input_status: first_pass_human_review_complete
  required_review_status: first_pass_review_complete
  required_human_decision: approve
  expected_question_count: 500
  expected_source_table_count: 500
  expected_materialized_fact_count: 8082
  expected_target_count: 500
  expected_hard_negative_count: 1000
  required_hard_negative_count_per_question: 2

retrieval_pilot:
  enabled: false
  scope: development_closed_corpus
  input_questions_path: results/synthetic/synthetic_questions_500.json
  input_facts_path: results/facts/synthetic_financial_fact_roundtrip.json
  required_question_status: first_pass_human_review_complete
  required_fact_status: financial_fact_roundtrip_passed
  expected_question_count: 500
  expected_table_count: 500
  expected_fact_count: 8082
  output_path: null
  table_evidence_policy: one_complete_source_table
  confirmatory_claims_allowed: false

table_parsing:
  source_format: markdown
  markdown_min_pipe_count: 2
  numeric_cells_only: true

representation:
  unit: financial_fact
  flattened_chunk:
    target_characters: 2000
    overlap_characters: 200
    preserve_table_boundaries: true
  financial_fact:
    schema_version: financial_fact_v1
    dimension_name_prefix: column_header
    currency_markers:
      "$": "$"
      "£": "£"
      "€": "€"
    percentage_markers:
      - "%"
    scale_markers:
      million: "1000000"
      thousand: "1000"
      billion: "1000000000"
    core_field_mapping:
      entity: entity
      concept: concept
      period: period
      unit: measurement
      raw_value: raw_value
      normalized_value: normalized_value
      source: source_address
      provenance: source_address
    preserve_raw_row_header_path: true
    preserve_raw_column_header_path: true
    arbitrary_dimensions_enabled: true
    dimension_encoding: name_value_pairs
    preserve_raw_dimension_names: true
    preserve_raw_dimension_values: true
    dimension_name_normalizer:
      implementation: null
      revision: null
      learn_from_split: train
    preserve_unknown_dimensions: true
    missing_dimension_policy: explicit_unknown
    stable_id_hash_algorithm: sha256
    normalised_value_decimal_places: null

normalisation:
  implementation: null
  revision: null
  preserve_raw_values: true
  preserve_accounting_negatives: true
  preserve_currency: true
  preserve_scale: true
  output_dir: data/normalised

splits:
  group_keys:
    - company_id
    - filing_id
    - derived_family_id
  prevent_table_leakage: true
  unseen_company_test: true
  unseen_filing_test: true
  unseen_table_structure_test: true

query_context:
  enabled: false
  mode: none
  apply_to_routes:
    - structured
  extractor:
    implementation: deterministic_regex_v1
    model: null
    revision: "1"
    temperature: 0.0
    max_output_tokens: 512
  arbitrary_dimensions_enabled: true
  missing_dimension_policy: mask
  confidence_threshold: 0.0

models:
  dense_encoder:
    name: sentence-transformers/all-MiniLM-L6-v2
    revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  generic_reranker:
    name: cross-encoder/ms-marco-MiniLM-L6-v2
    revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
  context_aware_reranker:
    name: null
    revision: null
  generator:
    name: null
    revision: null

indexes:
  dense_path: data/indexes/dense
  sparse_path: data/indexes/sparse
  structured_path: data/indexes/structured
  overwrite: true
  batch_size: 64

retrieval:
  routes:
    dense: false
    sparse: false
    structured: false
  dense:
    model_profile: dense_encoder
    similarity: cosine
    top_k: 50
    batch_size: 64
    normalize_embeddings: true
  sparse:
    algorithm: bm25
    top_k: 50
    k1: 1.2
    b: 0.75
    minimum_score_exclusive: 0.0
    token_pattern: "[A-Za-z0-9]+"
    lowercase: true
  structured:
    top_k: 100
    ranking_strategy: concept_then_context_compatibility
    exact_match_boost: 1.0
    partial_match_boost: 0.5
    unknown_field_policy: no_penalty
  candidate_union:
    enabled: false
    strategy: reciprocal_rank_fusion
    rrf_k: 60
    deduplicate_by: stable_evidence_id
    top_k: 100
  final_top_k: 20
  budget_matched_sensitivity:
    enabled: true
    final_candidate_counts:
      - 20
      - 50
      - 100

reranker:
  enabled: false
  kind: none
  model_profile: null
  input_top_k: 100
  output_top_k: 20
  batch_size: 16
  max_input_tokens: 512
  field_features:
    use_entity: true
    use_concept: true
    use_period: true
    use_unit: true
    use_arbitrary_dimensions: true
    use_raw_header_paths: true
    missing_value_indicator: true

training:
  enabled: false
  project_training: false
  negative_strategy: none
  seeds:
    - 20260815
    - 20260816
    - 20260817
  train_split: train
  validation_split: dev
  epochs: 5
  batch_size: 16
  learning_rate: 0.00002
  weight_decay: 0.01
  negatives_per_positive: 4
  early_stopping_patience: 2
  checkpoint_dir: results/checkpoints
  natural_hard_negative_types:
    - same_concept_different_period
    - same_concept_different_entity
    - same_concept_different_unit
    - same_headers_different_dimension
    - nearby_value_wrong_context

generation:
  deterministic_renderer_enabled: true
  llm_enabled: false
  model_profile: generator
  temperature: 0.0
  max_output_tokens: 256
  prompt_template: |-
    Answer the question using only the supplied evidence.
    Preserve the reported value, unit, period, entity, and source context.

evaluation:
  split: test
  chunk_metrics_enabled: false
  exact_cell_metrics_enabled: true
  downstream_answer_metrics_enabled: true
  chunk_cutoffs:
    - 1
    - 5
    - 10
    - 20
  exact_cell_cutoffs:
    - 1
    - 5
    - 10
    - 20
  chunk_metrics:
    - evidence_coverage_at_k
    - context_recall_at_k
  exact_cell_metrics:
    - hit_at_1
    - recall_at_k
    - mean_reciprocal_rank
  exact_cell_success_key: source_cell_id
  exact_cell_deduplicate_by: source_cell_id
  multiple_gold_comparison: closest_mismatch_then_cell_id
  error_metrics:
    - wrong_entity
    - wrong_concept
    - wrong_period
    - wrong_unit
    - wrong_dimension_by_canonical_name
    - retrieval_miss
    - reranking_miss
  answer_metrics:
    - normalised_exact_match
    - value_accuracy
    - unit_accuracy
    - evidence_supported
  bootstrap_samples: 10000
  confidence_level: 0.95
  minimum_practical_improvement: 0.05
  cluster_key: filing_id
  report_by_company: true
  report_by_filing: true
  report_by_table_structure: true

figures:
  enabled: false
  input_dir: results/evaluation
  output_dir: results/figures
  formats:
    - pdf
    - png
  dpi: 300

outputs:
  runs_dir: results/runs
  evaluation_dir: results/evaluation
  rankings_filename: rankings.jsonl
  metrics_filename: metrics.json
  resolved_config_filename: resolved_config.json
  include_full_candidate_traces: true
  include_full_resolved_config: true
  include_dataset_manifest_hashes: true
  timestamp_timezone: UTC
  hash_algorithm: sha256

runtime:
  device: cpu
  workers: 1
  deterministic_algorithms: true
  offline_primary_experiment: true
