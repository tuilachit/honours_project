condition:
  id: b0
  description: complete flattened tables with dense and sparse hybrid retrieval
  evidence_unit: flattened_chunk
  produces_exact_cell_ranking: false

retrieval_pilot:
  enabled: true
  output_path: results/runs/b0_development_pilot.json

representation:
  unit: flattened_chunk
  flattened_chunk:
    target_characters: null
    overlap_characters: 0
    preserve_table_boundaries: true

query_context:
  enabled: false
  mode: none

retrieval:
  routes:
    dense: true
    sparse: true
    structured: false
  candidate_union:
    enabled: true
    strategy: reciprocal_rank_fusion

reranker:
  enabled: false
  kind: none
  model_profile: null

training:
  enabled: false
  project_training: false
  negative_strategy: none

generation:
  deterministic_renderer_enabled: false
  llm_enabled: true

evaluation:
  chunk_metrics_enabled: true
  exact_cell_metrics_enabled: false
  downstream_answer_metrics_enabled: false
